var why=$("subwhy").value.trim()||"Tanpa alasan",real=Math.min(v,S.poin);
ask("Kurangi "+real+" poin? Alasan: "+why,function(){S.poin-=real;logPoin(-real,why);save();upd();renderOrtu();toast("−"+real+" poin")})};
el.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){S.hadiah=S.hadiah.filter(function(x){return x.id!=b.dataset.d});hadiahChanged();renderOrtu()}});
$("add").onclick=function(){var n=$("nn").value.trim(),p=parseInt($("np").value,10);
if(!n||!p||p<1){toast("Isi nama hadiah dan jumlah poin");return}
S.hadiah.push({id:Date.now(),e:$("ne").value.trim()||"🎁",n:n,p:p});hadiahChanged();renderOrtu();toast("Hadiah ditambahkan")};
$("rst").onclick=function(){ask("Hapus semua poin, hadiah, dan riwayat?",function(){var pn=S.pin,kd=S.kode,kr=S.kirim,ro=S.role,nm=S.nama,sc=S.sekolah;S=JSON.parse(JSON.stringify(DEF));S.pin=pn;S.kode=kd;S.kirim=kr;S.role=ro;S.nama=nm;S.sekolah=sc;S.v=3;hadiahChanged();upd();renderOrtu()})};
$("lock").onclick=function(){unlocked=false;ortuSynced=false;renderOrtu()};
if(S.role==="ortu"){var cdk=$("cl-msg").parentNode;el.insertBefore(cdk,el.firstChild);setTimeout(function(){if(cloudReady()&&$("cl-lihat"))$("cl-lihat").click()},0)}
if(S.role==="ortu"&&!ortuSynced){ortuSynced=true;ortuSyncIn()}
function clMsg(t){$("cl-msg").textContent=t}
$("cl-kode").onchange=function(){S.kode=this.value.trim();syncKirim();save();if(S.kirim)cloudPush()};
$("cl-out").onclick=function(){ask("Ganti role / logout dari device ini? Poin dan hadiah tetap tersimpan.",doLogout)};
if($("cl-local"))$("cl-local").onclick=function(){renderReview($("cl-view"),{nama:S.nama,sekolah:S.sekolah,poin:S.poin,sesi:S.sesi,riwayat:S.riwayat})};
if($("cl-now"))$("cl-now").onclick=function(){S.kode=$("cl-kode").value.trim();save();if(!cloudReady()){clMsg(SB_URL&&SB_KEY?"Isi token minimal 6 karakter.":"Cloud belum disetel di index.html.");return}
var k=S.kirim;S.kirim=true;clMsg("Mengirim…");cloudPush().then(function(ok){S.kirim=k;clMsg(ok?"Berhasil terkirim ✅":"Gagal mengirim. Cek koneksi dan pengaturan Supabase.")})};
if($("cl-lihat"))$("cl-lihat").onclick=function(){var kd=$("cl-kode").value.trim();S.kode=kd;save();if(!cloudReady()){clMsg(SB_URL&&SB_KEY?"Isi token minimal 6 karakter.":"Cloud belum disetel di index.html.");return}
clMsg("Mengambil data…");sbCall("get_progress",{p_id:kd}).then(function(rows){var r=rows&&rows[0];if(!r){clMsg("Belum ada data untuk token ini.");$("cl-view").innerHTML="";return}
var d=r.data||{};RC=d;var fm=function(t){try{return new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return""}};
clMsg("Data terakhir diperbarui: "+fm(r.updated_at));
var ss=(d.sesi||[]).slice(0,10),rw=(d.riwayat||[]).slice(0,10);
renderReview($("cl-view"),d);}).catch(function(){clMsg("Gagal mengambil data. Cek koneksi dan pengaturan Supabase.")})};
}

function upd(){$("pts").textContent=S.poin+" poin";$("hi").textContent=S.role==="ortu"?"Orang Tua":(S.nama?("Halo, "+S.nama+"!"):"Arena Juara")}
function tab(t){
if(Q&&Q.i<Q.qs.length&&t!="belajar"){
ask("Keluar dari sesi latihan ini dan membuka menu "+(t=="hadiah"?"Hadiah":"Orang Tua")+"?",function(){Q=null;tab(t)});
return;
}
if(t!="ortu"){unlocked=false;ortuSynced=false}
$("landing").classList.add("hide");
$("nav").classList.remove("hide");
$("pts").classList.remove("hide");
document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t==t)});
["belajar","hadiah","ortu"].forEach(function(x){$(x).classList.toggle("hide",x!=t)});
if(t=="belajar")renderBelajar();if(t=="hadiah")renderHadiah();if(t=="ortu")renderOrtu()}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab(b.dataset.t)}});
function ask(msg,yes){$("dmsg").textContent=msg;$("dlg").classList.remove("hide");$("dyes").onclick=function(){$("dlg").classList.add("hide");yes()};$("dno").onclick=function(){$("dlg").classList.add("hide")};$("dyes").focus()}
$("home").onclick=function(){
if(Q&&Q.i<Q.qs.length){
ask("Keluar dari sesi ini dan kembali memilih mapel?",function(){Q=null;tab("belajar");toast("Kembali ke pilihan mapel")});
return;
}
Q=null;if(needLogin()){renderLanding(false)}else{tab("belajar")}};
upd();
if(S.kirim)cloudSoon();
setTimeout(cloudPull,800);setInterval(cloudPull,45000);document.addEventListener("visibilitychange",function(){if(!document.hidden)cloudPull()});
if(needLogin()){renderLanding(false)}else{renderBelajar()}
</script>
</body>
</html>
